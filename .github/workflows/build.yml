name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test And Build (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.0', '1.27.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test -race -tags debug ./...

      - name: Vet
        run: go vet ./...

      - name: Build native library
        run: go build -tags debug -buildmode=c-shared -o dist/anthropic-image-guard.so .
